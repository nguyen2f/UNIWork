version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 290704
      MYSQL_DATABASE: UNIWORK
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql  # dùng volume cũ

volumes:
  mysql-data:
