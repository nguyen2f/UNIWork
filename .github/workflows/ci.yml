name: Java CI with Maven

on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Maven Build & Unit Tests
      working-directory: UNIWork
      run: |
        chmod +x mvnw
        ./mvnw clean test

    - name: Trigger Render Deploy Hook
      if: (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && github.event_name == 'push'
      env:
        DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        if [ -n "$DEPLOY_HOOK" ]; then
          echo "Triggering Render deployment..."
          curl -s -X POST "$DEPLOY_HOOK"
        else
          echo "RENDER_DEPLOY_HOOK secret is not set, skipping deployment."
        fi

