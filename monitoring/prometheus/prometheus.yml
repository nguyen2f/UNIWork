global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Spring Boot Backend Actuator Prometheus metrics
  - job_name: "uniwork-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          application: "UNIWork Backend"
          environment: "local"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

# Optional Prometheus Remote Write to Grafana Cloud:
# To forward local metrics to Grafana Cloud, uncomment and fill in your credentials:
# remote_write:
#   - url: "https://prometheus-prod-37-prod-ap-southeast-1.grafana.net/api/prom/push"
#     basic_auth:
#       username: "3794076"
#       password: "<YOUR_GRAFANA_CLOUD_API_TOKEN>"