global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Spring Boot Backend Actuator Prometheus metrics
  - job_name: "uniwork-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          application: "UNIWork Backend"
          environment: "local"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # cAdvisor: Container CPU, Memory, Network metrics
  - job_name: "cadvisor"
    scrape_interval: 10s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          environment: "local"
